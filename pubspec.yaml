name: student_id_scanner
description: A Flutter app for scanning student IDs using a Python backend.
publish_to: "none"
version: 1.2.0

environment:
  sdk: ">=2.17.0 <3.0.0"

uses-material-design: true

dependencies:
  flutter:
    sdk: flutter
  xml: ^6.6.1
  pdf: ^3.11.3
  http: ^1.5.0
  path: ^1.9.1
  excel: ^4.0.6
  image: ^4.3.0
  archive: ^3.6.1
  provider: ^6.0.0
  camera: ^0.11.2+1
  http_parser: ^4.1.2
  url_launcher: ^6.3.2
  file_picker: ^10.3.3
  image_picker: ^1.2.0
  firebase_auth: ^6.1.3
  firebase_core: ^4.3.0
  path_provider: ^2.1.5
  docx_template: ^0.4.0
  cupertino_icons: ^1.0.8
  flutter_pdf_text: ^0.9.0
  connectivity_plus: ^7.0.0
  package_info_plus: ^9.0.0
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.1
  flutter_tesseract_ocr: ^0.4.30
  syncfusion_flutter_xlsio: ^29.2.11
  google_mlkit_text_recognition: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/image/DITrix.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/image/DITrix.jpg
    - assets/tessdata/eng.traineddata
